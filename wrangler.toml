name = "jarvis"
main = "index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

# Spracherkennung (Whisper)
[ai]
binding = "AI"

# KV-Speicher
[[kv_namespaces]]
binding = "SPEICHER"
id = "46080b1ff0a64957b771b53c7543dcc6"

[vars]
# Notion-Seite "Jarvis · Wissen" (kein Geheimnis). Die Datenbanken legt Jarvis selbst darunter an.
NOTION_WISSEN_ID = "3f064a58e23e80019e8ecb5356036f0c"

# Zeitplan: Such-Agent läuft stündlich zur Viertelstunde
[triggers]
crons = ["15 * * * *"]
